[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frfl-federated-face-recognition"
version = "0.1.0"
description = "Federated face recognition research prototype with diff-weighted aggregation and FedProx"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
